
name: Compilar Muguet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-darwin

      - name: XcodeGen
        run: brew install xcodegen

      - name: Executar
        run: |
          xcodegen generate
          echo "Pronto"
